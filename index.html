<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookAI Scheduler — Login</title>
  <meta name="description" content="Multi-tenant AI booking and service scheduler" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/assets/icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
  <div class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-lg bg-sky-500 flex items-center justify-center font-bold text-lg">B</div>
          <span class="font-semibold text-lg tracking-tight">BookAI Scheduler</span>
        </div>
        <span class="text-sm text-slate-400 hidden sm:inline">Multi-Tenant PWA</span>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="flex border-b border-slate-200">
            <button id="tab-login" type="button"
              class="flex-1 py-3.5 text-sm font-medium text-sky-600 border-b-2 border-sky-600 bg-sky-50/40 transition">
              Login
            </button>
            <button id="tab-signup" type="button"
              class="flex-1 py-3.5 text-sm font-medium text-slate-500 hover:text-slate-700 transition">
              Sign Up
            </button>
          </div>

          <!-- Login -->
          <div id="form-login" class="p-6 space-y-4">
            <div>
              <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
              <input id="login-email" type="email" required autocomplete="email"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-sm"
                placeholder="you@business.com" />
            </div>
            <div>
              <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
              <div class="relative">
                <input id="login-password" type="password" required autocomplete="current-password"
                  class="w-full px-3.5 py-2.5 pr-11 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-sm"
                  placeholder="••••••••" />
                <button type="button" id="toggle-login-pw" aria-label="Show password"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <!-- eye open -->
                  <svg id="login-eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                  <!-- eye closed -->
                  <svg id="login-eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                  </svg>
                </button>
              </div>
            </div>
            <button id="btn-login" type="button"
              class="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-medium text-sm transition disabled:opacity-60">
              Login
            </button>
            <p id="login-error" class="text-sm text-red-600 hidden" role="alert"></p>
          </div>

          <!-- Signup -->
          <div id="form-signup" class="p-6 space-y-4 hidden">
            <div>
              <label for="signup-email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
              <input id="signup-email" type="email" required autocomplete="email"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-sm"
                placeholder="you@business.com" />
            </div>
            <div>
              <label for="signup-password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
              <div class="relative">
                <input id="signup-password" type="password" required minlength="6" autocomplete="new-password"
                  class="w-full px-3.5 py-2.5 pr-11 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition text-sm"
                  placeholder="At least 6 characters" />
                <button type="button" id="toggle-signup-pw" aria-label="Show password"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <svg id="signup-eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                  <svg id="signup-eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                  </svg>
                </button>
              </div>
            </div>
            <button id="btn-signup" type="button"
              class="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-medium text-sm transition disabled:opacity-60">
              Create Account
            </button>
            <p id="signup-error" class="text-sm text-red-600 hidden" role="alert"></p>
            <p class="text-xs text-slate-500 text-center leading-relaxed">
              After signup you will configure your business on the dashboard.
            </p>
          </div>
        </div>

        <p class="mt-8 text-center text-sm text-slate-500">
          Customers: open the unique booking link provided by the business.
        </p>
      </div>
    </main>

    <footer class="py-5 text-center text-xs text-slate-400">
      Multi-Tenant AI Booking PWA · Portfolio Project
    </footer>
  </div>

  <script type="module">
    import {
      auth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from './firebase-config.js';

    // Redirect authenticated users
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace('/dashboard.html');
    });

    // ---------- Password visibility toggles ----------
    function setupPasswordToggle(inputId, btnId, openId, closedId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      const eyeOpen = document.getElementById(openId);
      const eyeClosed = document.getElementById(closedId);
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', show);
        eyeClosed.classList.toggle('hidden', !show);
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    }
    setupPasswordToggle('login-password', 'toggle-login-pw', 'login-eye-open', 'login-eye-closed');
    setupPasswordToggle('signup-password', 'toggle-signup-pw', 'signup-eye-open', 'signup-eye-closed');

    // ---------- Friendly Firebase error messages ----------
    function authErrorMessage(err) {
      const code = err?.code || '';
      const map = {
        'auth/email-already-in-use': 'This email is already registered. Please Login instead.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please wait a few minutes.',
        'auth/network-request-failed': 'Network error. Check your internet connection.',
        'auth/operation-not-allowed': 'Email/Password sign-in is NOT enabled in Firebase Console → Authentication → Sign-in method.',
        'auth/unauthorized-domain': 'This domain is not authorized. Add your Vercel domain in Firebase Console → Authentication → Settings → Authorized domains.'
      };
      if (map[code]) return map[code];
      // Show actual code so we can diagnose
      return `Signup/Login failed (${code || 'unknown'}). Check Firebase Auth settings.`;
    }

    // ---------- Tabs ----------
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formLogin = document.getElementById('form-login');
    const formSignup = document.getElementById('form-signup');

    function activateTab(isLogin) {
      if (isLogin) {
        tabLogin.className = 'flex-1 py-3.5 text-sm font-medium text-sky-600 border-b-2 border-sky-600 bg-sky-50/40 transition';
        tabSignup.className = 'flex-1 py-3.5 text-sm font-medium text-slate-500 hover:text-slate-700 transition';
        formLogin.classList.remove('hidden');
        formSignup.classList.add('hidden');
      } else {
        tabSignup.className = 'flex-1 py-3.5 text-sm font-medium text-sky-600 border-b-2 border-sky-600 bg-sky-50/40 transition';
        tabLogin.className = 'flex-1 py-3.5 text-sm font-medium text-slate-500 hover:text-slate-700 transition';
        formSignup.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    tabLogin.addEventListener('click', () => activateTab(true));
    tabSignup.addEventListener('click', () => activateTab(false));

    // ---------- Login ----------
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      errEl.classList.add('hidden');
      if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error('Login error:', err.code, err.message);
        errEl.textContent = authErrorMessage(err);
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });

    // ---------- Signup ----------
    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const errEl = document.getElementById('signup-error');
      const btn = document.getElementById('btn-signup');

      errEl.classList.add('hidden');
      if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error('Signup error:', err.code, err.message);
        errEl.textContent = authErrorMessage(err);
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    // Enter key support
    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('signup-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-signup').click();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
