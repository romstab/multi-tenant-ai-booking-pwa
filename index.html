<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BookAI — Business Booking Platform</title>
  <meta name="description" content="Professional online booking for local businesses" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{500:'#0ea5e9',600:'#0284c7'}}}}}</script>
</head>
<body class="overflow-x-hidden bg-slate-50 text-slate-900 antialiased">
  <div class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white">
      <div class="max-w-lg mx-auto px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center font-bold text-sm">B</div>
          <div>
            <p class="font-semibold text-[15px] leading-tight">BookAI</p>
            <p class="text-[11px] text-slate-400">Booking for local businesses</p>
          </div>
        </div>
        <button id="btn-install" type="button" class="hidden text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700">Install</button>
      </div>
    </header>

    <main class="flex-1 flex flex-col justify-center px-4 py-8">
      <div class="max-w-md mx-auto w-full">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Grow with online bookings</h1>
          <p class="mt-2 text-sm text-slate-500 leading-relaxed">Accept appointments, manage your schedule, and share one booking link with customers.</p>
        </div>

        <div class="card overflow-hidden">
          <div class="flex border-b border-slate-200">
            <button type="button" id="tab-login" class="flex-1 py-3.5 text-sm font-semibold text-sky-600 border-b-2 border-sky-600 bg-sky-50/40">Log in</button>
            <button type="button" id="tab-signup" class="flex-1 py-3.5 text-sm font-semibold text-slate-500">Create account</button>
          </div>

          <div id="form-login" class="p-5 space-y-4">
            <div>
              <label class="label" for="login-email">Email</label>
              <input id="login-email" type="email" autocomplete="email" class="input" placeholder="you@business.com" />
            </div>
            <div>
              <label class="label" for="login-password">Password</label>
              <div class="relative">
                <input id="login-password" type="password" autocomplete="current-password" class="input pr-11" placeholder="••••••••" />
                <button type="button" id="toggle-login-pw" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400" aria-label="Show password">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
            <button type="button" id="btn-login" class="btn btn-primary btn-block">Log in</button>
            <p id="login-error" class="text-sm text-red-600 hidden" role="alert"></p>
          </div>

          <div id="form-signup" class="p-5 space-y-4 hidden">
            <div>
              <label class="label" for="signup-email">Work email</label>
              <input id="signup-email" type="email" autocomplete="email" class="input" placeholder="you@business.com" />
            </div>
            <div>
              <label class="label" for="signup-password">Password</label>
              <div class="relative">
                <input id="signup-password" type="password" minlength="6" autocomplete="new-password" class="input pr-11" placeholder="At least 6 characters" />
                <button type="button" id="toggle-signup-pw" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-400" aria-label="Show password">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
            <button type="button" id="btn-signup" class="btn btn-primary btn-block">Create account</button>
            <p id="signup-error" class="text-sm text-red-600 hidden" role="alert"></p>
            <p class="text-xs text-slate-500 text-center">After signup, a short setup wizard helps you go live in minutes.</p>
          </div>
        </div>

        <p class="mt-8 text-center text-xs text-slate-400">Customers use the booking link from their business — no account required.</p>
      </div>
    </main>
  </div>
  <div class="toast-wrap" id="toasts"></div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './firebase-config.js';

    onAuthStateChanged(auth, (user) => { if (user) location.replace('/dashboard.html'); });

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = 'toast toast-' + (type || 'info');
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function authErrorMessage(err) {
      const map = {
        'auth/email-already-in-use': 'This email is already registered. Please log in.',
        'auth/invalid-email': 'Invalid email address.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/operation-not-allowed': 'Email/Password is not enabled in Firebase Authentication.',
        'auth/unauthorized-domain': 'Add this domain in Firebase → Authentication → Authorized domains.'
      };
      return map[err?.code] || ('Could not continue (' + (err?.code || 'error') + ').');
    }

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    function activate(isLogin) {
      tabLogin.className = 'flex-1 py-3.5 text-sm font-semibold ' + (isLogin ? 'text-sky-600 border-b-2 border-sky-600 bg-sky-50/40' : 'text-slate-500');
      tabSignup.className = 'flex-1 py-3.5 text-sm font-semibold ' + (!isLogin ? 'text-sky-600 border-b-2 border-sky-600 bg-sky-50/40' : 'text-slate-500');
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-signup').classList.toggle('hidden', isLogin);
    }
    tabLogin.onclick = () => activate(true);
    tabSignup.onclick = () => activate(false);

    function setupToggle(inputId, btnId) {
      document.getElementById(btnId).onclick = () => {
        const i = document.getElementById(inputId);
        i.type = i.type === 'password' ? 'text' : 'password';
      };
    }
    setupToggle('login-password', 'toggle-login-pw');
    setupToggle('signup-password', 'toggle-signup-pw');

    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      errEl.classList.add('hidden');
      if (!email || !password) { errEl.textContent = 'Enter email and password.'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true; btn.textContent = 'Signing in…';
      try { await signInWithEmailAndPassword(auth, email, password); }
      catch (err) { errEl.textContent = authErrorMessage(err); errEl.classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Log in'; }
    };

    document.getElementById('btn-signup').onclick = async () => {
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const errEl = document.getElementById('signup-error');
      const btn = document.getElementById('btn-signup');
      errEl.classList.add('hidden');
      if (!email || !password) { errEl.textContent = 'Enter email and password.'; errEl.classList.remove('hidden'); return; }
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true; btn.textContent = 'Creating…';
      try { await createUserWithEmailAndPassword(auth, email, password); toast('Account created. Setting up…', 'success'); }
      catch (err) { errEl.textContent = authErrorMessage(err); errEl.classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Create account'; }
    };

    document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });
    document.getElementById('signup-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-signup').click(); });

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e;
      const b = document.getElementById('btn-install');
      if (b) b.classList.remove('hidden');
    });
    document.getElementById('btn-install')?.addEventListener('click', async () => {
      if (!deferredPrompt) { alert('Use browser menu → Add to Home screen / Install app.'); return; }
      deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
      document.getElementById('btn-install').classList.add('hidden');
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  </script>
</body>
</html>
